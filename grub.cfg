# Firmware boot script
#
# This script expects the following Grub2 modules to be compiled
# into the grub binary (bootarm.efi). See BR2_TARGET_GRUB2_BUILTIN_MODULES_EFI
# in nerves_defconfig:
#
# boot linux squash4 ext2 fat part_msdos normal loadenv echo true test
# sleep regexp fdt efi_gop
#

# Load the environment for the validation/fallback settings:
#
#   boot         0 boots rootfs A, 1 boots rootfs B
#   validated    1 once the running firmware has validated itself
#   booted_once  1 once unvalidated firmware has been given its one try
#
# A firmware update writes boot=<new>, validated=0, booted_once=0. The
# first boot marks it booted_once. Nerves.Runtime's StartupGuard validates
# it once all apps start (fwup-ops.conf's validate task writes validated=1).
# If it boots again without that, because it hung and was power cycled or
# StartupGuard rebooted it, switch back to the other partition.
load_env

if [ "$validated" = 0 ]; then
     if [ "$booted_once" = 1 ]; then
          echo "Firmware wasn't validated. Falling back..."
          if [ "$boot" = 1 ]; then
               set boot=0
          else
               set boot=1
          fi
          set validated=1
     else
          set booted_once=1
     fi
     save_env boot validated booted_once
fi

# $root is the partition GRUB was loaded from (e.g. "hd1,msdos1"). Use its
# disk rather than hardcoding hd0, since the internal eMMC, microSD card and
# USB drive can enumerate in any order.
regexp --set=1:bootdisk '^([^,]+),' "$root"

# Built from linux/0001-ARM-tegra-Add-Microsoft-Surface-RT-device-tree.patch
# and installed to /boot by Buildroot. See dts/README.md.
set dtb=tegra30-microsoft-surface-rt-efi.dtb

# Boot A or B depending on which one is active
if [ "$boot" = 1 ]; then
     echo "Booting partition B..."
     set rootfs=($bootdisk,msdos3)
     set rootuuid=04030201-03
else
     echo "Booting partition A..."
     set rootfs=($bootdisk,msdos2)
     set rootuuid=04030201-02
fi

# The kernel arguments come from /boot/kernel-args.grubenv in the rootfs
# (see post-build.sh), so changes to them ship with each firmware update
# and are covered by the fallback above. mix upload doesn't update this
# file. The default below is for firmware from before that file existed.
set linux_args="rootwait console=tty1 loglevel=4 cpuidle.off=1 clk_ignore_unused pd_ignore_unused"
load_env -f $rootfs/boot/kernel-args.grubenv linux_args

linux $rootfs/boot/zImage root=PARTUUID=$rootuuid $linux_args
devicetree $rootfs/boot/$dtb

# Boot!!!
boot
